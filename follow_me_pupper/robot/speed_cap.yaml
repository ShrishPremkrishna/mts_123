# Speed-cap override for follow-me, loaded by follow_me.launch.py on top of the
# monorepo's neural_controller config (which pupper_gait_deploy's install.py
# overwrites, so the override lives here instead).
#
# The default policy caps vx/vy at its walk speed (0.49 m/s) unless the
# joystick's run button is held, and neural_controller_default adds its own
# max_vx_forward: 0.49. Lift both so TRACK_FORWARD_VEL above 0.5 m/s actually
# reaches the policy and Pupper runs. 1.5 m/s is the policy's run cap.
neural_controller_default:
  ros__parameters:
    speed_cap: 1.5
    max_vx_forward: 1.5

neural_controller_default_alt:
  ros__parameters:
    speed_cap: 1.5
