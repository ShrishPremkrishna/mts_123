<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pupper FC</title>
<style>
  :root {
    --bg:#0a0e15; --panel:#111824; --panel2:#0d131d; --line:#1e2837; --ink:#eef2f8; --mute:#8592a6; --dim:#556275;
    --blue:#3b82f6; --blue-soft:#93c5fd; --red:#ef4444; --red-soft:#fca5a5; --ball:#ff5fa2;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --off:#4b5563;
    --fs:clamp(13px, 1.05vw, 22px);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font:var(--fs)/1.3 "SF Pro Display", -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
  .num { font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100vh; gap:.7em; padding:.8em 1em; }

  /* ---- header: brand, scoreboard, stop ---- */
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .brand { display:flex; align-items:center; gap:.8em; }
  .brand b { letter-spacing:.22em; font-size:1.05em; font-weight:800; }
  .chip { font-size:.72em; letter-spacing:.12em; text-transform:uppercase; padding:.3em .7em; border-radius:99px;
    background:#1b2433; color:var(--mute); white-space:nowrap; }
  .chip.rec { color:#fecaca; background:#3a1414; } .chip.rec::before { content:"● "; color:var(--red); }
  .score { display:flex; align-items:center; gap:1.1em; }
  .team-name { font-weight:800; letter-spacing:.16em; font-size:1.15em; display:flex; align-items:center; gap:.5em; }
  .team-name i { width:.9em; height:.9em; border-radius:.2em; display:inline-block; }
  .team-name.muted { opacity:.35; }
  .digit { font-size:3.4em; font-weight:800; line-height:1; min-width:1.1em; text-align:center; }
  .digit.pop { animation:pop .9s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform:scale(1); } 30% { transform:scale(1.6); } 100% { transform:scale(1); } }
  .clockbox { text-align:center; min-width:7.5em; }
  .clock { font-size:2.2em; font-weight:700; line-height:1.05; }
  .phase { font-size:.75em; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  .right { display:flex; justify-content:flex-end; align-items:center; gap:.8em; }
  .right a { color:var(--dim); font-size:.8em; text-decoration:none; }
  #stop { background:var(--red); border:0; color:#fff; font-weight:800; letter-spacing:.12em; padding:.7em 1.6em;
    border-radius:.6em; font-size:1.05em; box-shadow:0 0 0 3px #ef444433; }
  #stop:active, #estop:active { transform:scale(.97); }
  #stop small, #estop small { display:block; font-size:.6em; font-weight:600; letter-spacing:.04em; opacity:.9; }
  #estop { background:repeating-linear-gradient(-45deg, #facc15 0 .55em, #111 .55em 1.1em); border:0; padding:.28em; border-radius:.7em; }
  #estop > span { display:block; background:#b91c1c; color:#fff; font-weight:900; letter-spacing:.14em; padding:.5em 1.4em;
    border-radius:.5em; font-size:1.15em; }
  #estop > span, #stop { white-space:nowrap; }
  #estop.latched > span { background:#7f1d1d; box-shadow:inset 0 0 0 2px #fca5a5; }
  .estopbox { display:none; background:#450a0a; border:2px solid var(--bad); border-radius:.6em; padding:.55em .7em; color:#fee2e2; }
  .estopbox b { display:block; font-size:1.15em; letter-spacing:.06em; color:#fff; }
  .estopbox span { font-size:.8em; }
  .estopbox button { background:none; border:0; color:#fca5a5; text-decoration:underline; padding:0; font-size:.8em; }
  .stack { font-size:.72em; color:var(--mute); }
  .stack .w { color:var(--warn); display:block; }
  .opline .es { white-space:nowrap; color:#fca5a5; border:1px solid #7f1d1d; border-radius:.35em; padding:.05em .45em; text-decoration:none; font-weight:700; }

  /* ---- stage ---- */
  main { display:grid; grid-template-columns:minmax(14em, 1fr) minmax(0, 3.6fr) minmax(14em, 1fr); gap:.9em; min-height:0; }
  main.solo-blue { grid-template-columns:minmax(15em, 1fr) minmax(0, 3.9fr); }
  main.solo-red { grid-template-columns:minmax(0, 3.9fr) minmax(15em, 1fr); }
  main.solo-blue .team.red, main.solo-red .team.blue { display:none; }
  main.solo-red .pitch { order:-1; }
  .pitch { position:relative; min-height:0; border-radius:.9em; overflow:hidden; background:var(--panel2); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  .team { background:var(--panel); border:1px solid var(--line); border-radius:.9em; padding:1em; display:flex;
    flex-direction:column; gap:.8em; min-height:0; position:relative; overflow:hidden; }
  .team::before { content:""; position:absolute; inset:0 0 auto 0; height:.35em; background:var(--tc); }
  .team.blue { --tc:var(--blue); --tcs:var(--blue-soft); } .team.red { --tc:var(--red); --tcs:var(--red-soft); }
  .team.benched { opacity:.45; }
  .t-head { display:flex; align-items:center; justify-content:space-between; gap:.5em; margin-top:.2em; }
  .t-name { font-size:1.6em; font-weight:800; letter-spacing:.12em; color:var(--tcs); }
  .light { display:flex; align-items:center; gap:.45em; font-size:.8em; color:var(--mute); text-align:right; }
  .light i { width:.95em; height:.95em; border-radius:50%; flex:none; background:var(--off); }
  .light.ok i { background:var(--ok); box-shadow:0 0 .7em var(--ok); } .light.warn i { background:var(--warn); box-shadow:0 0 .7em var(--warn); }
  .light.bad i { background:var(--bad); box-shadow:0 0 .7em var(--bad); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  .role { font-size:1.9em; font-weight:800; letter-spacing:.1em; padding:.25em .55em; border-radius:.35em; align-self:flex-start;
    border:2px solid var(--tc); color:var(--tcs); transition:all .3s; }
  .role.attack { background:var(--tc); color:#fff; }
  .role.idle { border-color:var(--line); color:var(--dim); }
  .action { font-size:1.35em; font-weight:600; min-height:1.3em; }
  .sees { display:grid; grid-template-columns:auto 1fr; gap:.25em .7em; font-size:.85em; color:var(--mute); }
  .sees b { font-weight:600; color:var(--ink); } .sees .no { color:var(--warn); }
  .jobs { display:flex; gap:.3em; font-size:.75em; }
  .jobs button { flex:1; background:transparent; border:1px solid var(--line); border-radius:.4em; padding:.35em 0; color:var(--mute); }
  .jobs button.on { border-color:var(--tc); color:var(--ink); background:#ffffff0d; }
  .cam { position:relative; aspect-ratio:4/3; border-radius:.6em; background:#0a0f17; border:1px solid var(--line);
    overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.8em; }
  .cam img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .cam span { position:absolute; left:.6em; bottom:.4em; font-size:.85em; color:#cbd5e1; text-shadow:0 1px 2px #000; }
  .spacer { flex:1; }
  .ready { background:var(--tc); border:0; color:#fff; font-weight:700; letter-spacing:.08em; border-radius:.55em; padding:.75em; font-size:1em; }
  .ready:disabled { background:#1f2937; color:var(--mute); cursor:default; }
  .progress { height:.35em; background:#1f2937; border-radius:99px; overflow:hidden; display:none; }
  .progress b { display:block; height:100%; width:0; background:var(--tc); transition:width .4s; }
  .opline { font-size:.75em; color:var(--mute); min-height:1.2em; display:flex; justify-content:space-between; gap:.5em; }
  .opline button { background:none; border:0; color:var(--dim); text-decoration:underline; padding:0; font-size:1em; }

  /* ---- overlays on the pitch ---- */
  .banners { position:absolute; top:.8em; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:.4em;
    align-items:center; width:90%; pointer-events:none; }
  .banner { background:#3a1212ee; border:1px solid var(--bad); color:#fee2e2; padding:.45em 1em; border-radius:.5em; font-weight:600;
    font-size:1.05em; box-shadow:0 .4em 1.4em #0008; }
  .banner.warn { background:#3a2a0aee; border-color:var(--warn); color:#fef3c7; }
  .banner.big { font-size:1.45em; font-weight:800; border-width:2px; background:#7f1d1df2; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; text-align:center; }
  .center .big { font-size:5em; font-weight:900; letter-spacing:.08em; text-shadow:0 .1em .5em #000a; line-height:1; }
  .center .sub { margin-top:.5em; font-size:1.25em; color:#dbe3ee; background:#0a0e15cc; padding:.4em 1em; border-radius:.5em; }
  .center .sub:empty { display:none; }
  .center.count .big { font-size:9em; }
  .flash { position:absolute; inset:0; pointer-events:none; opacity:0; }
  .flash.go { animation:flash 2.2s ease-out; }
  @keyframes flash { 0% { opacity:0; } 8% { opacity:.85; } 100% { opacity:0; } }
  .goalword { animation:goalin 2.2s cubic-bezier(.2,1.4,.3,1) both; }
  @keyframes goalin { 0% { transform:scale(.3); opacity:0; } 15% { transform:scale(1.15); opacity:1; } 30% { transform:scale(1); }
    85% { opacity:1; } 100% { opacity:0; } }
  .card { pointer-events:auto; background:#0d131dee; border:1px solid var(--line); border-radius:1em; padding:1.4em 2.4em; }
  .card .big { font-size:3em; }
  .card .final { font-size:3.2em; font-weight:800; margin:.2em 0; }
  .legend { position:absolute; right:.8em; bottom:.6em; font-size:.7em; color:var(--mute); background:#0a0e15aa;
    padding:.25em .6em; border-radius:.4em; pointer-events:none; }

  /* ---- footer: ticker + controls ---- */
  footer { display:grid; grid-template-columns:minmax(0, 1.5fr) auto; gap:1em; align-items:stretch; }
  .ticker { background:var(--panel); border:1px solid var(--line); border-radius:.9em; padding:.6em 1em; overflow:hidden;
    display:flex; flex-direction:column; gap:.2em; height:6.2em; }
  .tk { display:flex; gap:.6em; align-items:baseline; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tk:first-child { color:var(--ink); font-size:1.18em; font-weight:600; animation:tkin .5s ease-out; }
  .tk i { width:.6em; height:.6em; border-radius:50%; flex:none; background:var(--dim); transform:translateY(-.05em); }
  .tk.blue i { background:var(--blue); } .tk.red i { background:var(--red); }
  .tk.goal { color:#fde68a; } .tk small { color:var(--dim); font-size:.75em; }
  @keyframes tkin { from { opacity:0; transform:translateY(-.4em); } }
  .controls { display:flex; gap:.5em; align-items:stretch; }
  .controls button { background:var(--panel); border:1px solid var(--line); border-radius:.7em; padding:.4em 1.1em;
    font-weight:700; letter-spacing:.05em; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:6.2em; }
  .controls button:hover { border-color:#334155; }
  .controls button kbd { font:inherit; font-size:.62em; color:var(--dim); font-weight:500; margin-top:.15em; }
  .controls button.primary { background:#14532d; border-color:#16a34a; }
  .controls button.lit { border-color:var(--warn); }
  .controls .touch b { font-size:1.4em; line-height:1; }

  dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:1em; padding:1.4em 1.8em;
    max-width:30em; font-size:1em; }
  dialog::backdrop { background:#000a; }
  dialog h3 { margin:0 0 .5em; font-size:1.4em; }
  dialog p { color:#cbd5e1; margin:.4em 0 1.2em; }
  dialog .row { display:flex; gap:.6em; justify-content:flex-end; }
  dialog button { border-radius:.5em; padding:.6em 1.2em; border:1px solid var(--line); background:transparent; }
  dialog button.go { background:var(--blue); border-color:var(--blue); font-weight:700; }
  #toast { position:fixed; left:50%; bottom:1.2em; transform:translateX(-50%); background:#1f2937; padding:.5em 1em; border-radius:.5em;
    font-size:.85em; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; } #toast.err { background:#7f1d1d; }
  #offline { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000c; font-size:2em; font-weight:700; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>PUPPER&nbsp;FC</b><span class="chip" id="src">sim</span><span class="chip rec" id="rec" hidden>rec</span></div>
    <div class="score">
      <div class="team-name" id="nb"><i style="background:var(--blue)"></i>BLUE</div>
      <div class="digit num" id="sb">0</div>
      <div class="clockbox"><div class="clock num" id="clock">0:00</div><div class="phase" id="phase">ready</div></div>
      <div class="digit num" id="sr">0</div>
      <div class="team-name" id="nr">RED<i style="background:var(--red)"></i></div>
    </div>
    <div class="right"><span class="chip num" id="touches" title="referee touches (T / shift+T)">touches 0</span>
      <a href="/ops" title="operator / test page">ops</a>
      <button id="stop" title="Space: every robot gets zero speed and stands still (legs stay on)">STOP<small>space · stand still</small></button>
      <button id="estop" title="Esc: every robot's legs switch off (the gamepad R3 action). It drops, damped, and stays down until Ready re-arms it"><span>E-STOP<small>Esc · legs off, drops</small></span></button></div>
  </header>
  <main id="stage">
    <aside class="team blue" data-team="blue"></aside>
    <section class="pitch" id="pitch">
      <canvas id="cv"></canvas>
      <div class="flash" id="flash"></div>
      <div class="center" id="center"></div>
      <div class="banners" id="banners"></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="team red" data-team="red"></aside>
  </main>
  <footer>
    <div class="ticker" id="ticker"></div>
    <div class="controls">
      <button id="bKick" class="primary">Kickoff<kbd>K</kbd></button>
      <button id="bPlay">Play<kbd>P</kbd></button>
      <button id="bReset">Reset<kbd>R</kbd></button>
      <button id="bVar">2 robots<kbd>V</kbd></button>
      <button id="bTouch" class="touch"><b id="touchN">0</b><kbd>touch T</kbd></button>
    </div>
  </footer>
</div>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgP"></p>
  <div class="row"><button id="dlgNo">Cancel</button><button id="dlgYes" class="go">Yes</button></div></dialog>
<div id="toast"></div>
<div id="offline">App not reachable: is fc.app running?</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const NAME = (id) => String(id).toUpperCase();
const COL = { blue: "#3b82f6", red: "#ef4444" }, SOFT = { blue: "#93c5fd", red: "#fca5a5" };
const PHASE = { kickoff: "kickoff", countdown: "get ready", play: "live", goal: "goal", restart: "ball reset",
                paused: "paused", full_time: "full time" };
let S = null, gotAt = 0, lastGoalN = 0, lastTickN = -1, view = "camera", built = "";

// ---------- server ----------
async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) toast(j.error || (j.errors || []).join("; ") || "refused", true);
    return j;
  } catch (e) { toast("app not reachable", true); return { ok: false }; }
}
const act = (action, extra) => post("/action", { action, ...extra });
let toastT = 0;
function toast(text, err) { const t = $("toast"); t.textContent = text; t.className = "show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "", 2600); }

// ---------- keys: space always stops, Esc always e-stops ----------
function stopAll() { act("stop"); toast("STOP sent: zero speed"); }
function estop(rid) {   // no confirmation: an e-stop must be instant
  if ($("dlg").open) $("dlgNo").click();
  act("estop", rid ? { robot: rid } : {}); toast(`E-STOP sent to ${rid ? NAME(rid) : "all robots"}: legs off`, true);
}
$("stop").onclick = stopAll;
$("estop").onclick = () => estop();
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); stopAll(); return; }
  if (e.key === "Escape") { e.preventDefault(); estop(); return; }
  if ($("dlg").open || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  const ids = S ? S.active : [];
  if (k === "k") act("kickoff");
  else if (k === "p") playPause();
  else if (k === "r") act("reposition");
  else if (k === "t") act("touch", { delta: e.shiftKey ? -1 : 1 });
  else if (k === "v") act("variant");
  else if (k === "c") { view = view === "camera" ? "field" : "camera"; toast("view: " + view); }
  else if ((k === "1" || k === "2") && ids[+k - 1]) cycleJob(ids[+k - 1]);
  else if (k === "h") hideCard = true;
}, true);
document.addEventListener("keyup", (e) => { if (e.code === "Space") e.preventDefault(); }, true);
document.addEventListener("click", (e) => { if (e.target.closest("button")) e.target.closest("button").blur(); });
let hideCard = false;
function playPause() {
  const f = S && S.play.flow;
  if (!f) return act("play");
  if (f.phase === "paused" || f.phase === "kickoff" || f.phase === "restart") return act("play");
  return act("pause");
}
function cycleJob(rid) {
  const f = S.play.flow; if (!f || !(rid in f.roles)) return toast("start a match first", true);
  const jobs = ["auto", "attack", "defend"]; act("job", { robot: rid, job: jobs[(jobs.indexOf(f.roles[rid]) + 1) % 3] });
}
$("bKick").onclick = () => act("kickoff");
$("bPlay").onclick = playPause;
$("bReset").onclick = () => act("reposition");
$("bVar").onclick = () => act("variant");
$("bTouch").onclick = (e) => act("touch", { delta: e.shiftKey ? -1 : 1 });
$("bTouch").oncontextmenu = (e) => { e.preventDefault(); act("touch", { delta: -1 }); };

// ---------- confirm dialog (Ready homes the legs) ----------
function confirmBox(title, text, yes) {
  return new Promise((res) => {
    $("dlgT").textContent = title; $("dlgP").textContent = text; $("dlgYes").textContent = yes;
    const d = $("dlg"); d.showModal();
    const done = (v) => { d.close(); $("dlgYes").onclick = $("dlgNo").onclick = null; res(v); };
    $("dlgYes").onclick = () => done(true); $("dlgNo").onclick = () => done(false);
  });
}
async function ready(rid) {
  const r = S.robots.find((q) => q.id === rid), prof = (S.preset && S.preset.profile) || r.profile;
  const st = stackTxt(S.preset && S.preset.stack), es = S.estop[rid];
  if (!await confirmBox(es ? `Re-arm ${NAME(rid)} after E-STOP?` : `Get ${NAME(rid)} ready?`,
    `Runs fcctl ready ${prof}${st ? " (" + st + ")" : ""} on ${r.host}. If the stack is off it HOMES THE LEGS (robot on the stand) and stops; press Ready again on the floor to STAND it up and start its link${es ? ", which also clears the E-STOP" : ""}. Area clear, R3 within reach?`, es ? "Yes, re-arm" : "Yes, get ready")) return;
  post("/robot", { robot: rid, op: "ready", confirm: true });
}

const stackTxt = (s) => !s ? "" : [s.speed_cap != null ? `speed cap ${Number(s.speed_cap).toFixed(2)}` : "", s.heading_hold ? `heading hold ${s.heading_hold}` : ""].filter(Boolean).join(" · ");

// ---------- team cards ----------
function buildCards() {
  for (const el of document.querySelectorAll(".team")) {
    const team = el.dataset.team, r = S.robots.find((q) => q.team === team);
    if (!r) { el.innerHTML = `<div class="t-head"><div class="t-name">${NAME(team)}</div></div><div class="action" style="color:var(--dim)">no robot configured</div>`; continue; }
    const id = esc(r.id);
    el.dataset.rid = r.id;
    el.innerHTML = `
      <div class="t-head"><div class="t-name">${NAME(r.id)}</div><div class="light" id="lt-${id}"><span></span><i></i></div></div>
      <div class="role idle" id="role-${id}">IDLE</div>
      <div class="action" id="act-${id}"></div>
      <div class="sees" id="sees-${id}"></div>
      <div class="jobs" id="jobs-${id}">${["auto", "attack", "defend"].map((j) =>
        `<button data-job="${j}" data-r="${id}">${j === "defend" ? "goalie" : j}</button>`).join("")}</div>
      ${r.cam_url ? `<div class="cam" id="cam-${id}"><img alt=""><div>front camera · not connected</div><span>front camera</span></div>` : ""}
      <div class="spacer"></div>
      <div class="estopbox" id="es-${id}"><b>E-STOPPED</b><span id="est-${id}"></span>
        <button data-esclear="${id}" hidden>clear (sim)</button></div>
      <div class="stack" id="stk-${id}"></div>
      <div class="progress" id="pg-${id}"><b></b></div>
      <div class="opline"><span id="op-${id}"></span><button data-down="${id}" title="fcctl down: lie down (a drop, same as R3), then stop the stack">down</button></div>
      <div class="opline esrow"><span>stop = stand still · E-STOP = legs off</span><button class="es" data-estop="${id}" title="Legs off for this robot only: it drops (damped) and stays down until Ready">E-STOP ${NAME(r.id)}</button></div>
      <button class="ready" id="rd-${id}" data-ready="${id}">Ready</button>`;
  }
  document.querySelectorAll("[data-job]").forEach((b) => b.onclick = () => act("job", { robot: b.dataset.r, job: b.dataset.job }));
  document.querySelectorAll("[data-ready]").forEach((b) => b.onclick = () => ready(b.dataset.ready));

  const bt = T && T.ball && smooth("tb", T.ball, dt, 0.05), bw = smooth("wb", Wd.ball, dt, 0.05);
  if (bt) drawBall(bt, false);
  if (bw) drawBall(bw, !!bt || M.cam);
  for (const rid of ids) {
    const tm = team(rid), truth = disp["t:" + rid], seen = disp["w:" + rid];
    if (truth) drawBody(truth, tm, 1);
    if (seen) ring(seen, tm, true, M.cam);
    const anchor = truth || seen;
    if (anchor) label(anchor, rid, tm, M.cam && !truth);
  }
}
requestAnimationFrame(frame);

// ---------- state poll (10 Hz) ----------
function render() { renderHeader(); renderCards(); renderCenter(); renderTicker(); }
async function poll() {
  try {
    const s = await (await fetch("/state")).json();
    if (S && S.play.flow && !s.play.flow) hideCard = false;
    S = s; gotAt = performance.now(); $("offline").style.display = "none"; render();
  } catch (e) { $("offline").style.display = "flex"; }
  setTimeout(poll, 100);
}
poll();
</script>
