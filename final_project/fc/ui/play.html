<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pupper FC</title>
<link rel="stylesheet" href="/kit/tokens.css">
<link rel="stylesheet" href="/kit/ui.css">
<style>
  /* layout only: every look comes from the kit */
  html, body { height:100%; overflow:hidden; }
  body { background:radial-gradient(110% 80% at 50% -15%, #16324f 0%, var(--c-bg) 60%) fixed; }
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:var(--s-3) var(--s-5) 0; }
  .brand { display:flex; align-items:center; gap:var(--s-3); color:inherit; text-decoration:none; }
  .brand .word { font-size:var(--t-5); }
  .brand .src { display:flex; align-items:center; gap:var(--s-2); color:var(--c-ink-3); font-weight:600; }
  .bug { display:flex; filter:drop-shadow(var(--shadow)); }
  .bug .plate { height:3.8rem; border-radius:0; padding:0 var(--s-5); gap:var(--s-4); }
  .bug .plate:first-child { border-radius:var(--r-panel) 0 0 var(--r-panel); }
  .bug .plate:last-child { border-radius:0 var(--r-panel) var(--r-panel) 0; }
  .bug .team { font-size:var(--t-5); letter-spacing:.08em; }
  .bug .score { font-size:var(--t-7); min-width:1ch; text-align:center; color:#fff; }
  .bug .score[data-pop] { animation:pop var(--d-slow) var(--ease-in); }
  @keyframes pop { 30% { transform:skewX(12deg) scale(1.5); color:var(--c-volt); } }
  .bug .mid { flex-direction:column; justify-content:center; gap:0; min-width:7.5rem; background:#050d16; }
  .bug .clock { font-size:var(--t-6); }
  .bug .phase { display:flex; align-items:center; gap:var(--s-1); font-size:var(--t-1); font-weight:700; color:var(--c-ink-2); }
  .bug .phase[data-live]::before { content:""; width:.5em; height:.5em; border-radius:50%; background:var(--c-stop); animation:blink 1.2s infinite; }
  .rec { justify-self:end; display:flex; align-items:center; gap:var(--s-2); font-weight:700; color:var(--c-red-soft); }

  main { display:grid; grid-template-columns:19rem minmax(0, 1fr) 19rem; gap:var(--s-4); padding:var(--s-4) var(--s-5); min-height:0; }
  main[data-solo="blue"] { grid-template-columns:19rem minmax(0, 1fr) 0; } main[data-solo="red"] { grid-template-columns:0 minmax(0, 1fr) 19rem; }
  .col { min-width:0; overflow:hidden; }
  .pitch { position:relative; min-height:0; }
  .pitch > canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .banners { position:absolute; top:var(--s-3); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center;
    gap:var(--s-2); z-index:var(--z-banner); pointer-events:none; width:max-content; max-width:92%; }
  .pitch .ticker { position:absolute; left:var(--s-3); bottom:var(--s-3); z-index:var(--z-hud); max-width:70%; }
  .center { position:absolute; inset:0; display:grid; place-items:center; z-index:var(--z-hud); pointer-events:none; text-align:center; }
  .center[data-low] { align-items:end; padding-bottom:9%; }
  .center .title { font-size:var(--t-7); padding:.1em .5em 0; }
  .center .sub { display:inline-block; margin-top:var(--s-3); padding:var(--s-2) var(--s-4); border-radius:var(--r-panel); background:var(--c-glass);
    font-size:var(--t-3); font-weight:600; color:var(--c-ink-2); }
  .center .count { font-size:calc(var(--t-8) * 1.6); text-shadow:0 .05em .3em #000a; animation:tick 1s ease-out both; }
  @keyframes tick { from { transform:scale(1.35); opacity:.2; } 25% { transform:none; opacity:1; } }
  .press { display:inline-flex; align-items:center; gap:var(--s-3); font:700 var(--t-5)/1 var(--f-display); letter-spacing:.06em;
    padding:var(--s-3) var(--s-5); background:var(--c-glass); border-radius:var(--r-panel); animation:breathe 2.4s ease-in-out infinite; }
  .press .key { font-size:var(--t-3); }
  @keyframes breathe { 50% { opacity:.55; } }
  .lobby { display:flex; flex-direction:column; align-items:center; gap:var(--s-4); }
  .lobby .pips { display:flex; gap:var(--s-3); }
  .lobby .pip { display:flex; align-items:center; gap:var(--s-2); padding:var(--s-2) var(--s-4); border-radius:var(--r-panel); background:var(--c-glass);
    font:700 var(--t-4)/1 var(--f-display); letter-spacing:.06em; color:var(--team-soft); }
  .goal { font-size:calc(var(--t-8) * 1.6); color:#fff; padding:.08em .4em 0; animation:slam .7s var(--ease-in) both; }
  @keyframes slam { from { transform:skewX(var(--skew)) scale(2.2); opacity:0; } }
  .final { display:flex; flex-direction:column; align-items:center; gap:var(--s-2); padding:var(--s-5) var(--s-7); background:rgb(8 19 31 / .94);
    border-radius:var(--r-panel); box-shadow:var(--shadow), inset 0 0 0 1px var(--c-stroke); }
  .final .ft { font-size:var(--t-5); color:var(--c-ink-2); letter-spacing:.14em; }
  .final .fs { font-size:var(--t-8); } .final .fs b:first-child { color:var(--c-blue-soft); } .final .fs b:last-child { color:var(--c-red-soft); }
  .final .meta { display:flex; gap:var(--s-5); color:var(--c-ink-2); }

  footer.bar { display:flex; align-items:center; gap:var(--s-2); padding:var(--s-2) var(--s-5) var(--s-3); }
  .bar .sep { width:1px; align-self:stretch; margin:var(--s-1) var(--s-2); background:var(--c-stroke); }
  .bar .grow { flex:1; }

  .drawer-in { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--s-5); padding:var(--s-5) var(--s-5) var(--s-6); }
  .drawer-head { display:flex; align-items:center; gap:var(--s-3); grid-column:1 / -1; }
  .drawer-head .display { font-size:var(--t-5); }
  .drawer-head .grow { flex:1; }
  .drawer .card-head .display { font-size:var(--t-6); }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="brand" href="/" title="Home"><span class="word display">PUPPER FC</span><span class="src" id="src"></span></a>
    <div class="bug" id="bug"></div>
    <div class="rec" id="rec"></div>
  </header>
  <main id="stage">
    <div class="col" id="col-blue"></div>
    <section class="pitch" id="pitch">
      <canvas id="cv"></canvas>
      <div class="center" id="center"></div>
      <div class="banners" id="banners"></div>
      <div class="ticker" id="ticker"></div>
    </section>
    <div class="col" id="col-red"></div>
  </main>
  <footer class="bar" id="bar"></footer>
</div>
<aside class="drawer" id="drawer" aria-label="Robots"></aside>
<div class="offline" id="offline"><b>App not reachable</b><span>Robots stop by themselves within 0.25 s. Restart fc/run.sh.</span></div>
<script type="module">
import { h, patch, pulse, keyOf, icon, NAME, cap, clock, createStore, createOps, createToast } from "/kit/kit.js";
import { createPitch } from "/kit/pitch.js";
const $ = (id) => document.getElementById(id);
const store = createStore(), toast = createToast();
const ops = await createOps(store, toast);
const teamOf = (s, rid) => (s.robots.find((r) => r.id === rid) || {}).team;
const RESULT = { full_time: "full time", ended: "ended", stopped: "stopped", estop: "e-stopped", estopped: "e-stopped" };
const PHASE = { kickoff: "kickoff", countdown: "get ready", play: "live", goal: "goal", restart: "ball reset", paused: "paused", full_time: "full time" };
const ROLE = { attack: "ATTACK", defend: "DEFEND", goto: "KICKOFF" };

// ---- view state (this screen only) ----
let main = "camera", hideCard = false, lastGoal = 0;
const pitch = createPitch($("cv"), { state: store.get, view: () => main });
ops.local({ name: "view.toggle", label: "Map", key: "C", run: (s) => { main = main === "camera" ? "map" : "camera"; },
            avail: (s) => s && s.source === "camera" ? { label: main === "camera" ? "Map" : "Field cam" } : { reason: "no field camera in sim", label: "Map" } })
   .local({ name: "drawer.toggle", label: "Robots", key: "Tab", run: () => $("drawer").toggleAttribute("data-open") })
   .local({ name: "card.hide", label: "Hide card", key: "H", run: () => { hideCard = true; } });

// ---- header ----
function renderHeader(s) {
  const f = s.play.flow, lm = !f ? s.play.last_match : null, m = f || lm, sc = m ? m.score : { blue: 0, red: 0 };
  patch($("bug"), "bug", () => [
    h("div", { class: "plate", "data-team": "blue", "data-fill": "team", id: "pb" }, h("span", { class: "team display" }, "BLUE"), h("span", { class: "score display num", id: "sb" }, "0")),
    h("div", { class: "plate mid" }, h("span", { class: "clock display num", id: "clock" }), h("span", { class: "phase", id: "phase" })),
    h("div", { class: "plate", "data-team": "red", "data-fill": "team-r", id: "pr" }, h("span", { class: "score display num", id: "sr" }, "0"), h("span", { class: "team display" }, "RED"))]);
  for (const [id, v] of [["sb", sc.blue], ["sr", sc.red]]) { const e = $(id); if (e.textContent !== String(v)) { const first = e.textContent === ""; e.textContent = v; if (!first) pulse(e, "data-pop"); } }
  for (const [id, t] of [["pb", "blue"], ["pr", "red"]]) $(id).toggleAttribute("data-dim", !s.play.playing.some((r) => teamOf(s, r) === t));
  const ph = $("phase"); ph.textContent = f ? PHASE[f.phase] || f.phase : lm ? RESULT[lm.result] || lm.result.replace("_", " ") : "ready";
  ph.toggleAttribute("data-live", !!f && f.phase === "play");
  patch($("src"), s.source, () => [h("i", { class: "light", "data-level": s.source === "sim" ? "warn" : "ok" }), s.source === "sim" ? "Sim" : "Live"]);
  patch($("rec"), String(s.play.recording), () => s.play.recording ? [h("i", { class: "light", "data-level": "bad" }), "REC"] : []);
  const solo = s.play.playing.length === 1 ? teamOf(s, s.play.playing[0]) : null;
  if (solo) $("stage").dataset.solo = solo; else delete $("stage").dataset.solo;
}
function tickClock() {   // every frame, so the clock runs smoothly between polls
  requestAnimationFrame(tickClock);
  const s = store.get(), c = $("clock"); if (!s || !c) return;
  const f = s.play.flow, m = f || (!hideCard && s.play.last_match);
  let left = m ? m.clock_left : s.params.match_s;
  if (f && f.phase === "play") left -= (performance.now() - store.at()) / 1000;
  const t = clock(left); if (c.textContent !== t) c.textContent = t;
}
requestAnimationFrame(tickClock);

// ---- player tiles: built once per robot, body re-rendered when it changes ----
const tiles = {};
function tileBody(s, r) {
  const pr = s.play.robots[r.id] || {}, w = s.world || { robots: {} }, me = w.robots[r.id], b = w.ball, d = s.debug[r.id] || {};
  const active = s.active.includes(r.id), playing = active && pr.playing, hl = pr.health || { level: "off", text: "" }, es = s.estop[r.id];
  const role = es ? "E-STOP" : playing && ROLE[pr.role] ? ROLE[pr.role] : !active ? "OFF" : s.play.flow ? (playing ? "IDLE" : "BENCH") : pr.ready ? "READY" : "NOT READY";
  const seen = me && me.age < 0.5, bseen = b && b.age < 1;
  return [
    h("div", { class: "tile-head" }, h("span", { class: "tile-name display" }, NAME(r.id)), h("i", { class: "light", "data-level": hl.level, title: hl.text })),
    h("div", null, h("span", { class: "plate role display", "data-fill": es ? "stop" : role === "ATTACK" ? "team" : "outline" }, h("span", null, role))),
    h("div", { class: "action" }, es ? "Legs off. Ready re-arms it." : playing && s.play.flow ? cap(pr.action || "") : cap(hl.text)),
    h("div", { class: "stats num" }, active ? [
      h("div", { class: "stat", "data-level": seen ? null : "warn" }, icon("eye"), seen ? `${Math.round(me.age * 1000)} ms` : "not seen"),
      h("div", { class: "stat", "data-level": bseen ? null : "warn" }, icon("ball"), bseen && me ? `${Math.hypot(b.x - me.x, b.y - me.y).toFixed(2)} m` : "not seen"),
      d.target && me && playing ? h("div", { class: "stat" }, icon("target"), `${Math.hypot(d.target[0] - me.x, d.target[1] - me.y).toFixed(2)} m`) : null,
      typeof d.my_cost === "number" && typeof d.opp_cost === "number" && playing
        ? h("div", { class: "stat" }, icon("race"), `${Math.max(0, d.my_cost).toFixed(1)} s`, h("small", null, `vs ${Math.max(0, d.opp_cost).toFixed(1)} s`)) : null] : [])];
}
function renderTiles(s) {
  for (const team of ["blue", "red"]) {
    const col = $("col-" + team), r = s.robots.find((q) => q.team === team);
    if (!r) { col.replaceChildren(); continue; }
    let t = tiles[r.id];
    if (!t) { t = tiles[r.id] = { body: h("div", { class: "tile-body", style: { display: "contents" } }) };
              t.el = h("div", { class: "tile", "data-team": r.team }, t.body); col.replaceChildren(t.el); }
    const pr = s.play.robots[r.id] || {};
    t.el.toggleAttribute("data-benched", !!s.play.flow && !pr.playing);
    if (s.estop[r.id]) t.el.dataset.level = "bad"; else delete t.el.dataset.level;
    const body = tileBody(s, r);
    if (patch(t.body, keyOf(body), () => body) && t.role && t.role !== pr.role) pulse(t.body.querySelector(".role"), "data-flip");
    t.role = pr.role;
  }
}

// ---- centre: one overlay for the match moment ----
function renderCenter(s) {
  const f = s.play.flow, c = $("center"); let node = null, low = false;
  if (f && f.goals.length && f.goals[f.goals.length - 1].n !== lastGoal) { lastGoal = f.goals[f.goals.length - 1].n; pitch.goal(f.goals[f.goals.length - 1].team); }
  if (f) {
    if (f.phase === "goal") { const g = f.goals[f.goals.length - 1] || {}; node = h("div", { class: "plate goal display", "data-team": g.team || "blue", "data-fill": "team" }, h("span", null, "GOAL")); }
    else if (f.phase === "countdown") node = h("div", { class: "count display num" }, Math.max(1, Math.ceil(f.countdown_left - (performance.now() - store.at()) / 1000)));
    else if (f.phase === "kickoff") { low = true; node = h("div", null, h("div", { class: "plate title display" }, h("span", null, "KICKOFF")), f.waiting.length ? h("div", null, h("div", { class: "sub" }, `Waiting for ${f.waiting.join(", ")}`)) : null); }
    else if (f.phase === "restart") { low = true; node = h("div", { class: "plate title display" }, h("span", null, "PLACE THE BALL")); }
    else if (f.phase === "paused") node = h("div", { class: "plate title display" }, h("span", null, "PAUSED"));
  } else if (s.play.last_match && !hideCard) {
    const lm = s.play.last_match;
    node = h("div", { class: "final" }, h("div", { class: "ft display" }, lm.result === "full_time" ? "FULL TIME" : "FINAL"),
      h("div", { class: "fs display num" }, h("b", null, lm.score.blue), " – ", h("b", null, lm.score.red)),
      h("div", { class: "meta num" }, h("span", null, `${clock(lm.clock)} played`), h("span", null, `${lm.touches} touches`)));
  } else if (s.mode === "idle") {
    const want = s.play.playing, ready = want.filter((rid) => (s.play.robots[rid] || {}).ready);
    if (ready.length < want.length) {
      low = true;
      node = h("div", { class: "lobby" }, h("div", { class: "plate title display" }, h("span", null, `READY CHECK ${ready.length}/${want.length}`)),
        h("div", { class: "pips" }, want.map((rid) => h("div", { class: "pip", "data-team": teamOf(s, rid) }, h("i", { class: "light", "data-level": (s.play.robots[rid] || {}).ready ? "ok" : "off" }), NAME(rid)))),
        h("div", { class: "press" }, h("span", { class: "key" }, "Tab"), "ROBOTS"));
    } else { low = true; node = h("div", { class: "press" }, h("span", { class: "key" }, "K"), "KICKOFF"); }
  }
  patch(c, keyOf(node), () => node); c.toggleAttribute("data-low", low);
  const bs = s.play.banners.map((x) => h("div", { class: "banner", "data-level": x.level === "warn" ? "warn" : null }, x.text));
  if (s.source === "camera" && s.eye && !s.eye.calibrated) bs.push(h("div", { class: "banner", "data-level": "warn" }, `Camera: ${s.eye.message}`));
  patch($("banners"), keyOf(bs), () => bs);
  const items = s.play.ticker.slice(-3).reverse();
  patch($("ticker"), items.map((x) => x.n).join(), () => items.map((x) => h("div", { class: "tick", "data-team": x.team || null, "data-kind": x.kind }, x.text)));
}

// ---- key bar: built once from the registry, refreshed every poll ----
const touchN = h("span", { class: "count num" }, "0");
const touch = ops.prompt("T", touchN); touch.shiftArgs = { delta: -1 };
const prompts = [ops.prompt("Space"), ops.prompt("Esc"), h("i", { class: "sep" }), ops.prompt("K"), ops.prompt("P"), ops.prompt("R"), ops.prompt("V"), touch,
  h("i", { class: "grow" }), ops.prompt("C"), h("i", { class: "sep" }), ops.prompt("Tab")];
$("bar").replaceChildren(...prompts);
ops.bindKeys({ shift: { "match.touch": { delta: -1 } }, opts: { stop: { done: "Stopped" }, estop: { done: "E-stop sent", level: "bad" } } });

// ---- robots drawer: the operator's menu ----
function robotCard(s, r) {
  const pr = s.play.robots[r.id] || {}, hl = pr.health || { level: "off", text: "" }, f = s.play.flow, job = f && f.roles[r.id], op = s.ops[r.id];
  const running = op && op.running, prog = running && op.op === "ready" ? Math.min(100, ((op.progress || {}).elapsed || 0) / 1.2) : null, es = s.estop[r.id];
  const real = s.source !== "sim" && (r.host || s.dry_run_ops);
  return h("div", { class: "card", "data-team": r.team },
    h("div", { class: "card-head" }, h("span", { class: "display" }, NAME(r.id)), r.host ? h("span", { class: "chip" }, r.host) : null, h("i", { class: "light", "data-level": hl.level })),
    h("div", { class: "st" }, cap(hl.text)),
    h("div", { class: "seg", "aria-disabled": String(!job) }, ["auto", "attack", "defend"].map((j) =>
      h("button", { type: "button", "aria-pressed": String(job === j), onclick: () => ops.run("match.job", { robot: r.id, job: j }) }, j === "defend" ? "Goalie" : cap(j)))),
    prog != null ? h("div", { class: "meter" }, h("i", { style: { width: prog + "%" } })) : null,
    h("div", { class: "acts" },
      real ? h("button", { class: "btn", type: "button", "data-tone": "go", "aria-disabled": String(!!running || pr.ready), onclick: () => ops.run("robot.ready", { robot: r.id }) },
        running && op.op === "ready" ? "Getting ready…" : es ? "Re-arm" : pr.ready ? "Ready ✓" : "Ready") : null,
      real ? h("button", { class: "btn", type: "button", onclick: () => ops.run("robot.down", { robot: r.id }) }, "Lie down") : null,
      es && s.source === "sim" ? h("button", { class: "btn", type: "button", "data-tone": "go", onclick: () => ops.run("estop.clear", { robot: r.id }) }, "Clear e-stop") : null,
      h("button", { class: "btn", type: "button", "data-tone": "stop", onclick: () => ops.run("estop", { robot: r.id }, { done: `E-stop sent to ${NAME(r.id)}`, level: "bad" }) }, `E-stop ${NAME(r.id)}`)));
}
function renderDrawer(s) {
  const cards = s.robots.map((r) => robotCard(s, r));
  patch($("drawer"), keyOf(cards), () => h("div", { class: "drawer-in" },
    h("div", { class: "drawer-head" }, h("span", { class: "display" }, "ROBOTS"), h("i", { class: "grow" }), h("a", { class: "btn", href: "/ops" }, "Test bench"), h("span", { class: "key" }, "Tab")),
    cards));
}

store.subscribe((s, online) => {
  $("offline").toggleAttribute("data-on", !online);
  if (!s) return;
  if (s.play.flow) hideCard = false;
  renderHeader(s); renderTiles(s); renderCenter(s); renderDrawer(s);
  for (const p of prompts) if (p.refresh) p.refresh();
  const m = s.play.flow || s.play.last_match; touchN.textContent = m ? m.touches : 0;
});
</script>
</body>
</html>
